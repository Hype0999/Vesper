  <!-- Obsidian rounded app tile -->
  <rect width="48" height="48" rx="11" fill="#080a0f" />
  <rect width="46" height="46" x="1" y="1" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  <circle cx="24" cy="24" r="20" fill="url(#vesperGlow)" />

  <!-- Platinum Monolith Left Pillar -->
